name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual runs from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_ENV:  ${{ secrets.APP_ENV }}   # put secret in step env
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs:     APP_ENV                 # tell the action to forward it
          script: |
            set -e
            APP_DIR=/opt/apps/${{ github.event.repository.name }}
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main && git reset --hard origin/main
            
            printf '%s\n' "$APP_ENV" > .env

            docker compose --env-file .env up -d --build --remove-orphans

